spring.application.name=payroll
server.port=8080

# Default to an in-memory H2 database so the project runs locally without extra setup.
# To use PostgreSQL, set DB_URL, DB_USERNAME, and DB_PASSWORD before starting the app.
spring.datasource.url=${DB_URL:jdbc:h2:mem:payroll;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Useful for local debugging when using the embedded database.
spring.h2.console.enabled=true
